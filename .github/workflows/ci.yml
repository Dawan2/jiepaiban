name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 术语合规（NFR-7）：产品源码里出现禁用词即挂 CI。
      - run: npm run lint:terms
      - run: npm test
      - run: npm run build
